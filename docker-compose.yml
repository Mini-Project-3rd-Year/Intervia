version: "3.9"

services:
  # ---- PostgreSQL with pgvector -------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: intervia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: intervia
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d intervia"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Backend (FastAPI) --------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: intervia-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/intervia
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ---- Frontend (Vite dev server) -----------------------
  frontend:
    image: node:20-alpine
    container_name: intervia-frontend
    working_dir: /app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
